name: Validar Terminal POS en Windows
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA256 del ZIP v16 validado
        required: true
permissions:
  contents: read
jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Descargar fuente verificada en ruta con caracteres especiales
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'pos.zip'
          Invoke-WebRequest 'https://raw.githubusercontent.com/gonzaloea1979/reconocimiento/db245e832fcf6eeed36469775d98dc5719c80941/Terminal_POS_1_0_5_Corregido_v16.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:EXPECTED_SHA.ToLower()) { throw 'SHA256 no coincide' }
          $dest = Join-Path $env:RUNNER_TEMP "Terminal POS ñ apostrofe's (v16)"
          Expand-Archive $zip $dest
          "POS_DIR=$dest\Terminal_POS_1_0" >> $env:GITHUB_ENV
      - name: Dependencias
        working-directory: ${{ env.POS_DIR }}
        run: python -m pip install -r requirements-build.txt
      - name: Pruebas completas incluidas interrupciones de procesos
        working-directory: ${{ env.POS_DIR }}
        run: python tests/run_all_tests.py
      - name: Instaladores BAT, permisos y junctions reales
        working-directory: ${{ env.POS_DIR }}
        run: python tests/windows_installation_checks.py
      - name: Compilar con BAT oficial y verificar EXE nativo
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        working-directory: ${{ env.POS_DIR }}
        run: python tests/windows_build_checks.py
      - name: Conservar diagnóstico de instalación y compilación
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diagnostico-windows-${{ matrix.python }}
          path: |
            ${{ env.POS_DIR }}/logs/*
            ${{ env.POS_DIR }}/build/TerminalPOS/warn-TerminalPOS.txt
            ${{ env.POS_DIR }}/dist/TerminalPOS/logs/*
